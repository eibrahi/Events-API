name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/events_api:latest .

      - name: Start container
        run: docker run -d -p 5000:5000 --name events-api-container ${{ secrets.DOCKER_HUB_USERNAME }}/events_api:latest

      - name: Set Up Python in Runner
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install requirements
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/events_api:latest